version: '3.8'

services:
  opencode-rotator:
    build: .
    container_name: opencode-rotator
    
    ports:
      - "20130:20130"  # Gateway
      - "3001:3001"    # Instance 1
      - "3002:3002"    # Instance 2
      - "3003:3003"    # Instance 3
    
    volumes:
      # Mount OpenCode databases (preserves OAuth tokens)
      - ./data/opencode:/root/.local/share/opencode
      
      # Mount config (edit on host, live in container)
      - ./config.yaml:/app/config.yaml:ro
      
      # Mount logs (optional)
      - ./logs:/app/logs
    
    environment:
      - NODE_ENV=production
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20130/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    networks:
      - opencode-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

networks:
  opencode-network:
    driver: bridge

volumes:
  opencode-data:
    driver: local
