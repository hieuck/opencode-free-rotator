# OpenCode Free Rotator — configuration example
#
# Architecture: hosted API pooling.
#   Each account is an OAuth credential inside an OpenCode SQLite database.
#   The gateway reads those tokens and forwards OpenAI-compatible requests to
#   https://opencode.ai/inference/openai/v1, rotating accounts as free quota runs
#   out. No `opencode serve` process is started and no extra port per account is
#   needed.
#
# Before running:
#   1. Authenticate each account once:  opencode auth login
#   2. Point every entry below at the DB holding that account's credential.
#      By default OpenCode uses ~/.local/share/opencode/opencode.db
#      (macOS: ~/Library/Application Support/opencode/opencode.db).
#   3. node cli.mjs status      # verifies tokens + real quota, starts nothing
#   4. node server.mjs          # starts the gateway

upstream:
  # Base URL the gateway forwards to. This is what OpenCode itself uses.
  baseUrl: "https://opencode.ai/inference/openai/v1"
  chatPath: "/chat/completions"
  modelsPath: "/models"

  # Per-organization quota buckets (rolling / weekly / monthly).
  # Requests need the `x-opencode-org-id` header, which is read from the credential.
  usageUrl: "https://opencode.ai/zen/go/v1/usage"

  # Sent as User-Agent on every upstream call.
  userAgent: "opencode/2.2.6"

  # Timeout for one completion. Streaming needs headroom.
  timeoutMs: 120000

accounts:
  - name: "OpenCode Free 1"
    email: "your-email-1@example.com"
    # OpenCode SQLite database that holds this account's `opencode` credential.
    db: "~/.local/share/opencode/opencode.db"
    # Credential integration id (default: opencode).
    integrationId: "opencode"
    # Local safety-net counter. The real free quota is enforced and reported by
    # the provider; this only prevents a runaway loop from hammering one account.
    quotaPerDay: 200
    enabled: true
    # orgId: "wrk_..."        # optional override; normally read from the credential

  # Second account = second database (a copy of an authenticated DB, or a
  # separate OpenCode profile).
  # - name: "OpenCode Free 2"
  #   email: "your-email-2@example.com"
  #   db: "~/.local/share/opencode/db2.db"
  #   quotaPerDay: 200
  #   enabled: true

  # Static token accounts are also supported (useful for CI / smoke tests):
  # - name: "CI token"
  #   token: "st_..."
  #   orgId: "wrk_..."
  #   enabled: true

gateway:
  port: 20130
  host: "127.0.0.1"

  # Fallback daily counter limit for accounts without their own quotaPerDay.
  defaultQuotaPerDay: 200

  # Account selection:
  # - "lowest-usage": fewest requests first (recommended)
  # - "round-robin": rotate through available accounts
  selectionStrategy: "lowest-usage"

  # Fail over to another account on 401 / 402 / 429 / 5xx.
  retryOnFailure: true
  maxRetries: 3

  # Cooldown after a 429 that carries no reset information (ms).
  cooldownOn429Ms: 60000

  # Timeout for forwarded requests (ms).
  requestTimeout: 120000

  # Re-read provider quota this often (ms). 0 disables polling.
  quotaRefreshMs: 300000

  # Local counters survive restarts; set to null to keep them in memory only.
  stateFile: ".rotator-state.json"

  # Optional: UTC hour for the local counter reset (default 0 = midnight UTC).
  # quotaResetHour: 0

tokens:
  # Re-read the credential row this often so tokens refreshed by `opencode`
  # itself are picked up automatically (ms).
  cacheTtlMs: 15000

  # Refresh this long before the access token expires (ms).
  refreshSkewMs: 120000

  # Write a rotated token pair back into the OpenCode DB. Keep enabled: the
  # provider rotates refresh tokens, so skipping this would eventually log the
  # desktop app out.
  writeBack: true

  # OAuth client id used by OpenCode's device/refresh flow.
  clientId: "opencode-cli"

logging:
  level: "info" # debug, info, warn, error
  logRequests: true
