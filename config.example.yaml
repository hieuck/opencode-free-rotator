# OpenCode Free Rotator - Configuration Example
#
# Before running:
# 1. Create 3+ OpenCode free accounts (separate emails)
# 2. Authenticate each account once so its credentials land in that account's DB.
#    The rotator gives every instance its own OPENCODE_DB, so every instance has
#    its own account and its own quota.
# 3. Start the gateway: node server.mjs

# ---------------------------------------------------------------------------
# How the rotator launches `opencode serve` (all keys optional)
# ---------------------------------------------------------------------------
opencode:
  # Executable to run. Use an absolute path if opencode is not on PATH.
  command: "opencode"

  # Address each spawned server binds to. Keep 127.0.0.1 unless you must expose it.
  hostname: "127.0.0.1"

  # `opencode serve` protects every /api/* route with HTTP Basic auth, so the
  # gateway needs credentials. The rotator generates a random per-instance
  # password by default; set one here to pin it, or "auto" to let opencode
  # generate it (the rotator parses "server password ..." from stdout).
  username: "opencode"
  password: ""

  # Readiness probe. `/api/info` returns JSON; `/health` returns the web UI HTML
  # and must NOT be used here.
  healthPath: "/api/info"
  startupTimeoutMs: 30000
  healthIntervalMs: 500

  # Real quota source. `/api/experimental/usage/limits` reports the account's
  # rolling/weekly/monthly percentages and whether it is currently limited.
  # Use "local" to rely only on quotaPerDay counters, or "off" to disable.
  quotaSource: "auto"
  quotaPath: "/api/experimental/usage/limits"
  quotaPollIntervalMs: 60000

  # Extra arguments appended to `serve --port <port> --hostname <host>`.
  extraArgs: []

# ---------------------------------------------------------------------------
# Instances - one OpenCode account per instance
# ---------------------------------------------------------------------------
instances:
  - name: "OpenCode Free 1"
    email: "your-email-1@example.com"
    port: 3001
    db: "~/.local/share/opencode/db1.db"
    quotaPerDay: 200
    enabled: true
    # password: "instance-specific-secret"   # optional per-instance override

  - name: "OpenCode Free 2"
    email: "your-email-2@example.com"
    port: 3002
    db: "~/.local/share/opencode/db2.db"
    quotaPerDay: 200
    enabled: true

  - name: "OpenCode Free 3"
    email: "your-email-3@example.com"
    port: 3003
    db: "~/.local/share/opencode/db3.db"
    quotaPerDay: 200
    enabled: true

# ---------------------------------------------------------------------------
# Gateway settings
# ---------------------------------------------------------------------------
gateway:
  port: 20130
  host: "127.0.0.1"

  # Fallback daily counter limit for instances without their own quotaPerDay.
  defaultQuotaPerDay: 200

  # Daily quota reset time (UTC hour, 0-23). 0 = midnight UTC.
  quotaResetHour: 0

  # Instance selection strategy:
  # - "lowest-usage": least used instance first (recommended)
  # - "round-robin": rotate through available instances
  selectionStrategy: "lowest-usage"

  # Retry with another instance if one fails.
  retryOnFailure: true
  maxRetries: 3

  # How long (ms) an instance is skipped after it answers 429.
  # Retry-After / retryAfterMs from the instance take precedence.
  cooldownOn429Ms: 60000

  # Timeout for forwarded requests (milliseconds).
  requestTimeout: 60000

  # Path the gateway forwards OpenAI-style requests to.
  # NOTE: OpenCode v2 does not provide /v1/chat/completions. See
  # docs/OPENCODE_API_FINDINGS.md before changing this.
  upstreamPath: "/v1/chat/completions"

# Logging
logging:
  level: "info"  # debug, info, warn, error
  logFile: "gateway.log"
  logRequests: true
