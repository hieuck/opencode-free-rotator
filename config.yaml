# OpenCode Free Rotator — hosted API pooling
#
# Every account is an OpenCode credential (OAuth token) inside an OpenCode
# SQLite database. The gateway reads those tokens and forwards OpenAI-style
# requests to OpenCode's hosted inference API, rotating accounts when one runs
# out of free quota.
#
# Validate without starting anything:  node cli.mjs status
# Start the gateway:                 node server.mjs

upstream:
  # Hosted, OpenAI-compatible inference base (from OpenCode's own model catalog).
  baseUrl: "https://opencode.ai/inference/openai/v1"
  chatPath: "/chat/completions"
  modelsPath: "/models"
  # Real per-organization quota: rolling / weekly / monthly buckets.
  usageUrl: "https://opencode.ai/zen/go/v1/usage"
  userAgent: "opencode/2.2.6"
  timeoutMs: 120000

accounts:
  - name: "OpenCode Free 1"
    email: "hieuck.dev@gmail.com"
    # Same DB the desktop app / CLI uses. Read-only unless a token refresh rotates.
    db: "~/.local/share/opencode/opencode.db"
    integrationId: "opencode"
    quotaPerDay: 200
    enabled: true

gateway:
  port: 20130
  host: "127.0.0.1"
  defaultQuotaPerDay: 200
  # "lowest-usage" (recommended) or "round-robin"
  selectionStrategy: "lowest-usage"
  # Fail over to another account on 401/402/429/5xx.
  retryOnFailure: true
  maxRetries: 3
  # Cooldown after a 429 without provider reset info (ms).
  cooldownOn429Ms: 60000
  # Timeout for one forwarded completion (ms). Streaming responses need room.
  requestTimeout: 120000
  # How often to re-read the provider's real usage (ms). 0 disables polling.
  quotaRefreshMs: 300000
  # Local request counters survive restarts. Set to null to keep them in memory.
  stateFile: ".rotator-state.json"

tokens:
  # Re-read the credential row on this interval so a token refreshed by
  # `opencode` itself is picked up automatically (ms).
  cacheTtlMs: 15000
  # Refresh this long before expiry (ms).
  refreshSkewMs: 120000
  # Persist a rotated access/refresh pair back into the OpenCode DB. Keep this on:
  # the provider rotates the refresh token, so skipping the write-back would
  # eventually log the desktop app out.
  writeBack: true
  clientId: "opencode-cli"

logging:
  level: "info"
  logRequests: true
