opencode:
  command: "opencode"
  hostname: "127.0.0.1"
  username: "opencode"
  password: ""
  healthPath: "/api/info"
  startupTimeoutMs: 30000
  healthIntervalMs: 500
  quotaSource: "auto"
  quotaPath: "/api/experimental/usage/limits"
  quotaPollIntervalMs: 60000
  extraArgs: []

instances:
  - name: "OpenCode Free 1"
    email: "account1@example.com"
    port: 3001
    db: "~/.local/share/opencode/db1.db"
    quotaPerDay: 200
    enabled: true

  - name: "OpenCode Free 2"
    email: "account2@example.com"
    port: 3002
    db: "~/.local/share/opencode/db2.db"
    quotaPerDay: 200
    enabled: true

  - name: "OpenCode Free 3"
    email: "account3@example.com"
    port: 3003
    db: "~/.local/share/opencode/db3.db"
    quotaPerDay: 200
    enabled: true

gateway:
  port: 20130
  host: "127.0.0.1"
  defaultQuotaPerDay: 200
  quotaResetHour: 0
  selectionStrategy: "lowest-usage"
  retryOnFailure: true
  maxRetries: 3
  cooldownOn429Ms: 60000
  requestTimeout: 60000
  upstreamPath: "/v1/chat/completions"

logging:
  level: "info"
  logFile: "gateway.log"
  logRequests: true
